<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChemLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>ChemLab</h1>
<p class="sub">Tap an element to learn about it, then pick a reagent and react.</p>

<div class="bench" id="bench">
  <div class="stove" id="stove">
    <div class="burner-ring"><div class="flame" id="flame"></div></div>
  </div>
  <div class="beaker-wrap">
    <div class="beaker" id="beaker">
      <div class="liquid empty" id="liquid"></div>
      <canvas class="swirl-canvas" id="swirlCanvas"></canvas>
      <div class="flash" id="flash"></div>
    </div>
  </div>
</div>

<p class="section-label">1. Choose an element</p>
<div class="legend">
  <span><span class="swatch metal"></span>Metal</span>
  <span><span class="swatch nonmetal"></span>Nonmetal</span>
</div>
<div class="grid" id="grid"></div>

<p class="section-label">2. Choose a reagent — or heat it on the stove</p>
<div class="reagents" id="reagentTray">
  <div class="reagent-btn" data-val="H2O">💧 Water</div>
  <div class="reagent-btn" data-val="O2">🫧 Oxygen</div>
  <div class="reagent-btn" data-val="HCl">🧪 Acid</div>
  <div class="reagent-btn" data-val="NaOH">⚗️ Base</div>
  <div class="reagent-btn" data-val="heat">🔥 Heat (stove)</div>
</div>

<button class="react-btn" id="reactBtn">REACT</button>

<div class="result" id="result">
  <div class="eq" id="resultEq"></div>
  <div class="meta" id="resultMeta"></div>
  <div class="why" id="resultWhy"></div>
</div>

<div class="properties-panel" id="propertiesPanel">
  <p class="section-label">Product properties</p>
  <div class="prop-row"><span class="prop-label">Formula</span><span class="prop-value" id="propFormula"></span></div>
  <div class="prop-row"><span class="prop-label">State</span><span class="prop-value" id="propState"></span></div>
  <div class="prop-row"><span class="prop-label">Color</span><span class="prop-value" id="propColor"></span></div>
  <div class="prop-row"><span class="prop-label">Real-world use</span><span class="prop-value" id="propUse"></span></div>
</div>

<!-- Info drawer: opens when a tile is tapped, shows the element's reactivity note -->
<div class="drawer" id="drawer">
  <button class="drawer-close" id="drawerClose" aria-label="Close">✕</button>
  <div class="drawer-handle"></div>
  <div class="drawer-top">
    <span class="drawer-symbol" id="drawerSymbol"></span>
    <span class="drawer-name" id="drawerName"></span>
  </div>
  <div class="drawer-meta" id="drawerMeta"></div>
  <div class="drawer-note" id="drawerNote"></div>
</div>

<script src="script.js"></script>
</body>
</html>
